# NutriChef Spring Boot Backend Configuration (Production - Render & Aiven MySQL)
spring.application.name=nutrichef-backend
server.port=${PORT:8080}

# Aiven Cloud MySQL DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security
nutrichef.jwt.secret=${JWT_SECRET}
nutrichef.jwt.expiration-ms=86400000

# CORS Production Allowed Origins
nutrichef.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Edamam Nutrition API Credentials
nutrichef.edamam.app-id=${EDAMAM_APP_ID:}
nutrichef.edamam.app-key=${EDAMAM_APP_KEY:}

# Server Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
