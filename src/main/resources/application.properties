# NutriChef Spring Boot Backend Configuration (Local Development)
spring.application.name=nutrichef-backend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutrichef_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
nutrichef.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
nutrichef.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
nutrichef.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

# Edamam Nutrition API Configuration (Optional - Demo mode activates when empty)
nutrichef.edamam.app-id=${EDAMAM_APP_ID:}
nutrichef.edamam.app-key=${EDAMAM_APP_KEY:}

# Actuator / Logging
logging.level.org.springframework.security=INFO
logging.level.com.nutrichef=INFO
